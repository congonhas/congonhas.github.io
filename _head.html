<meta name="author" content="Flávio Cunha">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2c2e" media="(prefers-color-scheme: dark)">
<link rel="me" href="https://scholar.google.com/citations?user=M9MsticAAAAJ">
<script>
/* Set the theme before the page paints, so a night visitor never sees a
   white flash. The full logic is in the footer script; this is only the
   first paint. */
(function () {
  try {
    var m = sessionStorage.getItem('theme') || 'auto', t = m;
    if (m === 'auto') {
      var h = new Date().getHours();
      var os = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      t = (os || h >= 19 || h < 7) ? 'dark' : 'white';
    }
    document.documentElement.setAttribute('data-bg', t);
  } catch (e) {}
})();
</script>

<!-- ---------------------------------------------------------------------------
     GoatCounter. Cookieless, so no consent banner is required.
     Dashboard: https://flaviocunha.goatcounter.com
     --------------------------------------------------------------------------- -->
<script data-goatcounter="https://flaviocunha.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script>
/* Paper and essay link events.

   The script above counts page views. A PDF cannot run a script, and a DOI or
   NBER link leaves the site entirely, so the thing you most want to know, which
   papers people actually open, would otherwise be invisible.

   This records one event per link, labelled with the title of the thing being
   opened, so the dashboard reads as a list of work rather than a list of URLs.
   It fires for the title link and for the PDF, Journal and NBER badges alike,
   since all three mean the same thing: someone went to read it. BibTeX
   downloads are not counted.

   Note that these events are stored in the same path field as page views, so
   they appear in the dashboard alongside real pages, prefixed. A row reading
   "pdf: ..." or "essay: ..." is an event, not a page that exists.

   Three sources of a label, in order:
     .paper   a paper on the research page; title is the .t heading
     .entry   an essay in the Center listing; title is the first link
     .essay-meta  the Download as PDF link in an essay byline, where the
                  title is the page's own h2.sec heading
   Anything else, the CV link in the nav above all, keeps its filename. */
document.addEventListener('click', function (ev) {
  var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
  if (!a) return;
  if (!window.goatcounter || !window.goatcounter.count) return;

  var href = a.getAttribute('href') || '';
  var isPdf = /\.pdf($|[?#])/i.test(href);
  var isPaperLink = isPdf || /doi\.org|nber\.org\/papers/i.test(href);
  if (!isPaperLink) return;

  var container = a.closest('.paper, .entry');
  var isEssay = false;
  var label;

  if (container) {
    isEssay = container.classList.contains('entry');
    var heading = container.querySelector('.t') || container.querySelector('a');
    label = heading ? heading.textContent.trim() : href;
  } else if (a.closest('.essay-meta')) {
    isEssay = true;
    var pageHeading = document.querySelector('h2.sec');
    label = pageHeading ? pageHeading.textContent.trim() : href;
  } else {
    label = href;
  }

  var prefix = isEssay ? 'essay: ' : (isPdf ? 'pdf: ' : 'link: ');

  window.goatcounter.count({
    path:  prefix + label.slice(0, 120),
    title: href,
    event: true
  });
});
</script>
